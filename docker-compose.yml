services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: base64:replace_me_after_running_key_generate
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: form_builder
      DB_USERNAME: form_builder
      DB_PASSWORD: secret
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql
      - redis

  horizon:
    build: .
    command: php artisan horizon
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: base64:replace_me_after_running_key_generate
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: form_builder
      DB_USERNAME: form_builder
      DB_PASSWORD: secret
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
    volumes:
      - .:/var/www/html
    depends_on:
      - app
      - redis

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: form_builder
      MYSQL_USER: form_builder
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  mysql-data:
